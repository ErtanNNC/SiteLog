name: Eval

# Compare Claude models on the golden sets (spec §10.13) without anyone handling the Anthropic key
# locally: the key stays in the preview Environment's secrets, and the owner dispatches this
# workflow from spec-v1.2 with the model ids to compare (RUNBOOK §2 "Compare models"). Until the
# default branch has this file, dispatch it through Deploy: environment preview, target eval.
#
# For every model × set it runs `pnpm eval -- --set <set> --json <file>` with that model as both
# CLAUDE_MODEL and CLAUDE_MODEL_FAST, then writes one Markdown table to the job summary (model, set,
# passed/total, failed cases, tokens, estimated cost at apps/worker/src/ai/cost.ts rates, time) and
# uploads the JSON files as the `eval-results` artifact.
#
# Read-only: `contents: read`, the one secret ANTHROPIC_API_KEY (handed to the eval step only and
# never echoed), no database, no Supabase, no other provider. Failed cases do not fail the run (it
# is a comparison); a set that ends without its JSON (a broken fixture, a crash) does.
# scripts/src/eval-workflow.test.ts holds the file to that.
#
# The model ids below are defaults of the dispatch form, not logic.

on:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated Claude model ids; each runs as both CLAUDE_MODEL and CLAUDE_MODEL_FAST
        type: string
        default: claude-sonnet-5-5,claude-haiku-5-5,claude-opus-5-5
      sets:
        description: Comma-separated golden sets (extraction, answers, corrections, utterances), or all
        type: string
        default: all
  # Deploy (target eval) calls this file: a workflow_dispatch needs the file on the default branch,
  # which has no eval.yml before the cut-over, while deploy.yml is there.
  workflow_call:
    inputs:
      models:
        description: Comma-separated Claude model ids; each runs as both CLAUDE_MODEL and CLAUDE_MODEL_FAST
        type: string
        default: claude-sonnet-5-5,claude-haiku-5-5,claude-opus-5-5
      sets:
        description: Comma-separated golden sets (extraction, answers, corrections, utterances), or all
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    name: Eval · models × golden sets
    # Branch guard on the full ref (a tag named like the branch does not pass): the preview
    # Environment's key is for spec-v1.2 only.
    if: github.ref == 'refs/heads/spec-v1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: preview
    steps:
      - name: Check inputs
        env:
          MODELS_INPUT: ${{ inputs.models }}
          SETS_INPUT: ${{ inputs.sets }}
        run: |
          # Inputs reach the scripts as environment variables only, and must look like ids.
          models=""
          IFS=',' read -ra items <<< "$MODELS_INPUT"
          for m in "${items[@]}"; do
            m="$(printf '%s' "$m" | tr -d '[:space:]')"
            [ -z "$m" ] && continue
            if ! printf '%s' "$m" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._@:-]{0,99}$'; then
              echo "::error::not a model id: $m"
              exit 1
            fi
            case ",$models," in *",$m,"*) continue ;; esac
            models="${models:+$models,}$m"
          done
          if [ -z "$models" ]; then
            echo "::error::no model ids given."
            exit 1
          fi
          all="extraction,answers,corrections,utterances"
          sets=""
          IFS=',' read -ra items <<< "${SETS_INPUT:-all}"
          for s in "${items[@]}"; do
            s="$(printf '%s' "$s" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            [ -z "$s" ] && continue
            if [ "$s" = all ]; then
              sets="$all"
              break
            fi
            case ",$all," in
              *",$s,"*) ;;
              *)
                echo "::error::unknown golden set: $s (one of $all, or all)"
                exit 1
                ;;
            esac
            case ",$sets," in *",$s,"*) continue ;; esac
            sets="${sets:+$sets,}$s"
          done
          sets="${sets:-$all}"
          echo "Models: $models"
          echo "Sets: $sets"
          {
            echo "EVAL_MODELS=$models"
            echo "EVAL_SETS=$sets"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the golden sets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::the preview Environment has no ANTHROPIC_API_KEY secret."
            exit 1
          fi
          out="$RUNNER_TEMP/eval-results"
          mkdir -p "$out"
          files=()
          missing=0
          IFS=',' read -ra models <<< "$EVAL_MODELS"
          IFS=',' read -ra sets <<< "$EVAL_SETS"
          for model in "${models[@]}"; do
            safe="$(printf '%s' "$model" | tr -c 'A-Za-z0-9._-' '_')"
            for set in "${sets[@]}"; do
              file="$out/$safe.$set.json"
              log="$out/$safe.$set.log"
              status=0
              echo "::group::$model · $set"
              CLAUDE_MODEL="$model" CLAUDE_MODEL_FAST="$model" \
                pnpm --silent eval -- --set "$set" --json "$file" > "$log" 2>&1 || status=$?
              cat "$log"
              echo "::endgroup::"
              if [ -s "$file" ]; then
                files+=("$file")
                if [ "$status" != 0 ]; then echo "::notice::$model · $set: some cases failed (see the table)."; fi
              else
                echo "::error::$model · $set ended without a summary (exit $status); see its log."
                missing=1
              fi
            done
          done
          {
            echo "## Eval: models × golden sets"
            echo
            echo "Each model ran as both CLAUDE_MODEL and CLAUDE_MODEL_FAST. Cost is an estimate at apps/worker/src/ai/cost.ts rates."
            echo
            if [ "${#files[@]}" -gt 0 ]; then
              pnpm --silent eval -- --summarize "${files[@]}"
            else
              echo "No set produced a summary."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$missing"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: ${{ runner.temp }}/eval-results
          if-no-files-found: ignore
          retention-days: 30
