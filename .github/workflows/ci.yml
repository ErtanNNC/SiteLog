name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · lint · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # pdftotext for the worker's PDF text snapshots (apps/worker/src/pdf/snapshot.test.ts).
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
      - run: pnpm test
      - name: Build web + field + worker
        run: pnpm build

  db:
    name: Migrations · RLS · RPC tests (PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  edge-functions:
    name: Deno check (edge functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint supabase/functions
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      - run: deno test --config supabase/functions/deno.json --allow-env --allow-net supabase/functions

  e2e:
    name: E2E · smoke + accessibility (Playwright, demo mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @sitelog/web exec playwright install --with-deps chromium
      # Smoke flows + §15/M9 axe WCAG 2.2 AA scan of every route at 1440/375 px + keyboard checks.
      - run: pnpm --filter @sitelog/web e2e
      # Field app (W1-04): every route in EN/ES/TR at 390 px, axe, no sideways scroll, PWA basics.
      # Built with no env set: no Supabase URL, so no /api proxy.
      - name: Field app smoke test
        if: success() || failure()
        run: pnpm --filter @sitelog/field e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-demo
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/field/playwright-report
            apps/field/test-results
          retention-days: 7

  e2e-supabase:
    name: E2E · local Supabase stack (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      # `supabase start` loads supabase/functions/.env into the Edge Runtime. Only APP_URL matters
      # here (CORS origin of the panel under test); the rest are dummies so no function boots
      # half-configured. Nothing here reaches Meta, Stripe or Anthropic.
      - name: Edge Function env
        run: |
          cat > supabase/functions/.env <<'ENV'
          APP_URL=http://localhost:5173
          WA_VERIFY_TOKEN=e2e-verify-token
          WA_APP_SECRET=e2e-app-secret
          SCHEDULER_SECRET=e2e-scheduler-secret
          STRIPE_SECRET_KEY=sk_test_e2e_dummy
          STRIPE_WEBHOOK_SECRET=whsec_e2e_dummy
          STRIPE_PRICE_ID_SITE=price_e2e_dummy
          ENV
      - name: Start Supabase (migrations + seed.sql)
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta,mailpit
      # The shared Database type is hand-maintained; fail when it drifts from the migrated schema.
      - name: Shared DB types match the schema
        run: |
          supabase gen types typescript --local --schema public > "$RUNNER_TEMP/db.gen.ts"
          pnpm --filter @sitelog/scripts db-types-drift -- "$RUNNER_TEMP/db.gen.ts"
      - name: Export API URL and keys
        run: |
          supabase status -o env 2>/dev/null \
            | sed -E 's/^([A-Z0-9_]+)="(.*)"$/\1=\2/' \
            | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' >> "$GITHUB_ENV"
      # First request per function downloads its npm/jsr imports; do it before the browser waits.
      - name: Warm up Edge Functions
        run: |
          for fn in api-export-payroll api-evidence-pack; do
            curl -sS -o /dev/null -m 180 -w "$fn %{http_code}\n" \
              -H "Authorization: Bearer $ANON_KEY" "$API_URL/functions/v1/$fn" || true
          done
      - name: Install Chromium
        run: pnpm --filter @sitelog/web exec playwright install --with-deps chromium
      - name: Login · realtime · edit → v2 · sign-off · payroll CSV · EOT pack
        run: pnpm --filter @sitelog/web e2e:supabase
      - name: Supabase logs
        if: failure()
        run: |
          for c in edge_runtime realtime auth rest; do
            echo "::group::$c"; docker logs "supabase_${c}_sitelog" --tail 150 2>&1 || true; echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-supabase
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  eval:
    name: Extraction evals (golden transcripts)
    # Paid API calls: main and manual runs only (feature-branch pushes skip it).
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval
