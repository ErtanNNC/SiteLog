name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · lint · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # pdftotext for the worker's PDF text snapshots (apps/worker/src/pdf/snapshot.test.ts).
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
      - run: pnpm test
      - name: Build web + field + worker
        run: pnpm build

  db:
    name: Migrations · RLS · RPC tests (PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  edge-functions:
    name: Deno check (edge functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint supabase/functions
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      - run: deno test --config supabase/functions/deno.json --allow-env --allow-net supabase/functions

  e2e:
    name: E2E · smoke + accessibility (Playwright, demo mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @sitelog/web exec playwright install --with-deps chromium
      # Smoke flows + §15/M9 axe WCAG 2.2 AA scan of every route at 1440/375 px + keyboard checks.
      - run: pnpm --filter @sitelog/web e2e
      # Field app: the placeholder routes and the W1-09 screens (device check, welcome, Today,
      # Recording with Chromium's fake microphone, Processing, the offline queue, the No work and
      # Weather sheets) in EN/ES/TR at 390 px on a fake field-api (Playwright routes), axe, no
      # sideways scroll, PWA basics. Built with no env set: no Supabase URL, so no /api proxy.
      - name: Field app smoke test
        if: success() || failure()
        run: pnpm --filter @sitelog/field e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-demo
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/field/playwright-report
            apps/field/test-results
          retention-days: 7

  e2e-supabase:
    name: E2E · local Supabase stack (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      # `supabase start` loads supabase/functions/.env into the Edge Runtime. APP_URL is the CORS
      # origin of the panel under test; field-api signs device codes and derives personal link
      # codes with LINK_SIGNING_SECRET (the worker below uses the same one) and accepts browser
      # origins FIELD_APP_URL and CORS_EXTRA_ORIGINS (the field app's dev and preview servers, and
      # :4176, its e2e:supabase preview). STORAGE_PUBLIC_URL re-bases the signed upload URLs from
      # the Edge Runtime's internal http://kong:8000 to the API URL the browser reaches (W1-09).
      # sms-webhook checks X-Twilio-Signature with TWILIO_AUTH_TOKEN against SMS_WEBHOOK_URL. The
      # rest are dummies so no function boots half-configured. No pack has a sender id here, so
      # every text goes to the console driver: nothing reaches Meta, Stripe, Twilio or Anthropic.
      - name: Edge Function env
        run: |
          cat > supabase/functions/.env <<'ENV'
          APP_URL=http://localhost:5173
          LINK_SIGNING_SECRET=e2e-link-signing-secret-not-for-production
          FIELD_APP_URL=http://localhost:5174
          CORS_EXTRA_ORIGINS=http://localhost:4174,http://localhost:4176
          STORAGE_PUBLIC_URL=http://127.0.0.1:54321
          TWILIO_AUTH_TOKEN=e2e-twilio-auth-token
          SMS_WEBHOOK_URL=http://127.0.0.1:54321/functions/v1/sms-webhook
          WA_VERIFY_TOKEN=e2e-verify-token
          WA_APP_SECRET=e2e-app-secret
          SCHEDULER_SECRET=e2e-scheduler-secret
          STRIPE_SECRET_KEY=sk_test_e2e_dummy
          STRIPE_WEBHOOK_SECRET=whsec_e2e_dummy
          STRIPE_PRICE_ID_SITE_US=price_e2e_dummy
          ENV
      - name: Start Supabase (migrations + seed.sql)
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta,mailpit
      # The shared Database type is hand-maintained; fail when it drifts from the migrated schema.
      - name: Shared DB types match the schema
        run: |
          supabase gen types typescript --local --schema public > "$RUNNER_TEMP/db.gen.ts"
          pnpm --filter @sitelog/scripts db-types-drift -- "$RUNNER_TEMP/db.gen.ts"
      - name: Export API URL, keys and DB URL
        run: |
          supabase status -o env 2>/dev/null \
            | sed -E 's/^([A-Z0-9_]+)="(.*)"$/\1=\2/' \
            | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=' >> "$GITHUB_ENV"
      # Real-Postgres tests that PGlite (one session) cannot run, e.g. next_report_no under
      # concurrency (supabase/db-tests/stack). They create and delete their own org.
      - name: Real-Postgres tests (test:stack)
        env:
          SUPABASE_DB_URL: ${{ env.DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "::error::supabase status gave no DB_URL"; exit 1; }
          pnpm test:stack
      # First request per function downloads its npm/jsr imports; do it before the browser waits.
      - name: Warm up Edge Functions
        # Each function must boot and refuse: the api-* functions the anon key (401; the
        # api-invite-reporter probe is a POST, its only method, for the stack test below), field-api
        # (no gateway JWT check) a request without a link code (401), sms-webhook (no gateway JWT
        # check either) a POST without X-Twilio-Signature (403, so TWILIO_AUTH_TOKEN is loaded).
        # The Edge Runtime container has no restart policy, so if it exits while booting the first
        # worker it is started again (a run once failed with 502 here and 503 in the payroll and
        # EOT specs).
        run: |
          container=supabase_edge_runtime_sitelog
          for probe in GET:api-export-payroll:401 GET:api-evidence-pack:401 POST:api-invite-reporter:401 GET:field-api/today:401 POST:sms-webhook:403; do
            IFS=: read -r method fn want <<< "$probe"
            code=000
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sS -o "$RUNNER_TEMP/warm.out" -m 180 -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer $ANON_KEY" "$API_URL/functions/v1/$fn" || echo 000)
              echo "$fn attempt $attempt: HTTP $code"
              [ "$code" = "$want" ] && break
              state=$(docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' "$container" 2>&1 || true)
              echo "Edge Runtime: $state"
              case "$state" in running*) ;; *) docker start "$container" ;; esac
              sleep 5
            done
            if [ "$code" != "$want" ]; then
              echo "::error::$fn did not boot (last HTTP $code, want $want)"
              cat "$RUNNER_TEMP/warm.out" || true
              docker logs "$container" --tail 100 2>&1 || true
              exit 1
            fi
          done
      # field-api (W1-07) through the gateway: resolve → send-code → verify (the code from the
      # console messages row) → consent → upload by signed URL → complete (site-day, report, job),
      # confirm, the device cookie, no-store and the refusals (supabase/db-tests/stack/
      # field-api.test.ts; its RPC race on two sessions already ran in test:stack above).
      # api-invite-reporter (W1-08) as Lena: the locale from "Speaks", the personal link and its
      # audit, the welcome job, no code in the answer, a reused reporter, a number that sent STOP
      # (supabase/db-tests/stack/api-invite-reporter.test.ts).
      - name: field-api and api-invite-reporter against the stack
        env:
          SUPABASE_DB_URL: ${{ env.DB_URL }}
          FIELD_API_URL: ${{ env.API_URL }}/functions/v1/field-api
          INVITE_API_URL: ${{ env.API_URL }}/functions/v1/api-invite-reporter
          LINK_SIGNING_SECRET: e2e-link-signing-secret-not-for-production
        run: |
          test -n "$API_URL" || { echo "::error::supabase status gave no API_URL"; exit 1; }
          pnpm --filter @sitelog/db exec vitest run --config vitest.stack.config.ts stack/field-api.test.ts stack/api-invite-reporter.test.ts -t "on the local stack"
      - name: Install Chromium
        run: pnpm --filter @sitelog/web exec playwright install --with-deps chromium
      # The field app (W1-09) on the stack, at 390 px with Chromium's fake microphone: a reporter
      # of its own demo org opens the personal link → device check (the code from the console
      # messages row) → consent → Today → record → the clip by signed URL → complete creates the
      # report (processing, channel web) and the transcribe_upload job → Processing; axe on every
      # screen. Before the worker starts, so the job is still queued (apps/field/e2e/supabase/).
      - name: Field app · link → device check → consent → record → upload
        run: pnpm --filter @sitelog/field e2e:supabase
      # The `supabase` project: no worker runs, so the jobs these specs enqueue stay queued.
      - name: Login · realtime · edit → v2 · sign-off · payroll CSV · EOT pack
        run: pnpm --filter @sitelog/web e2e:supabase --project=supabase
      # The worker (W1-08) against the stack, keyless: console SMS and console email (both land in
      # the Demo phone), the fake transcriber (W1-11: a voice note gets a fixtures/voice
      # transcript, no Deepgram key), no AI or weather keys (those jobs fail and retry), the same
      # LINK_SIGNING_SECRET as the functions. It starts after the panel specs, so their jobs (the
      # EOT pack, PDFs) are processed now and the specs above still see them queued.
      - name: Start the worker
        env:
          SUPABASE_DB_URL: ${{ env.DB_URL }}
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          EMAIL_PROVIDER: console
          TRANSCRIBE_PROVIDER: fake
          LINK_SIGNING_SECRET: e2e-link-signing-secret-not-for-production
          FIELD_APP_URL: http://localhost:5174
          WORKER_PORT: '8080'
          # W1-10: the worker wakes on NOTIFY jobs (LISTEN on DB_URL, a direct session connection).
          # The poll is set past the specs' 60 s waits, so the invite's welcome cannot wait for the
          # poll: NOTIFY (or the wake after another job finishes) claims it. The HELP reply is
          # answered inline by sms-webhook's /demo-reply, not by the worker.
          POLL_INTERVAL_MS: '120000'
        run: |
          nohup pnpm --filter @sitelog/worker exec tsx src/index.ts > "$RUNNER_TEMP/worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/worker.pid"
          for attempt in $(seq 1 60); do
            body=$(curl -sS -m 5 http://127.0.0.1:8080/health || true)
            case "$body" in *'"listening":true'*) echo "worker healthy and listening after ${attempt}s"; exit 0 ;; esac
            sleep 1
          done
          echo "::error::the worker did not answer /health with listening: true (last: $body)"
          cat "$RUNNER_TEMP/worker.log" || true
          exit 1
      # The `worker` project: invite → the worker's welcome text in the Demo phone → the personal
      # link resolves at field-api → HELP re-sends it (W1-08 Done when).
      - name: Invite → welcome text in the Demo phone (worker)
        env:
          WORKER_HEALTH_URL: http://127.0.0.1:8080/health
        run: pnpm --filter @sitelog/web e2e:supabase --project=worker
      - name: Supabase logs
        if: failure()
        run: |
          docker ps -a --filter name=supabase_ --format '{{.Names}} {{.Status}}' || true
          for c in edge_runtime realtime auth rest; do
            echo "::group::$c"; docker logs "supabase_${c}_sitelog" --tail 150 2>&1 || true; echo "::endgroup::"
          done
          echo "::group::worker"; tail -n 200 "$RUNNER_TEMP/worker.log" 2>/dev/null || true; echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-supabase
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/field/playwright-report
            apps/field/test-results
          retention-days: 7

  eval:
    name: Extraction evals (golden transcripts)
    # Paid API calls: main and manual runs only (feature-branch pushes skip it).
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval
