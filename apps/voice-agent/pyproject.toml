[project]
name = "sitelog-voice"
version = "0.1.0"
description = "TalkOlog voice agent: the phone and Talk now channel (spec §4.2, §9.4), LiveKit Agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "livekit-agents[anthropic,azure,deepgram,silero]==1.8.3",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "jsonschema==4.26.0",
  "sentry-sdk==2.71.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-socket==0.8.1",
  "respx==0.23.1",
  "ruff==0.16.10",
  "pyright==1.1.414",
]

[project.scripts]
sitelog-voice = "sitelog_voice.agent:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitelog_voice"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = [
  "RUF001", # the copy carries typographic punctuation (em dashes) on purpose
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# pytest-socket: no network in any test (the fakes answer everything); respx intercepts httpx
# before a socket opens. Unix sockets stay allowed for asyncio's self-pipe.
addopts = "--disable-socket --allow-unix-socket -m 'not live'"
markers = [
  "live: needs real provider keys and network (by hand, never in CI)",
]
