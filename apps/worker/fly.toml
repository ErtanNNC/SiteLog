# Example Fly.io config for the SiteLog worker. Deploy from the repo root:
#   fly launch --no-deploy --copy-config --config apps/worker/fly.toml
#   fly secrets set SUPABASE_DB_URL=... SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... \
#     WA_PHONE_NUMBER_ID=... WA_ACCESS_TOKEN=... OPENAI_API_KEY=... DEEPGRAM_API_KEY=... ANTHROPIC_API_KEY=... RESEND_API_KEY=... SENTRY_DSN=...
#   fly deploy --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile
app = "sitelog-worker"
primary_region = "dfw"

[build]
  dockerfile = "apps/worker/Dockerfile"

[env]
  NODE_ENV = "production"
  WORKER_PORT = "8080"
  # Slots mostly wait on WhatsApp / OpenAI / Claude: 2 machines x 10 file 500 reports in 30 min
  # (load test, RUNBOOK section 7).
  WORKER_CONCURRENCY = "10"
  AUDIO_RETENTION_DAYS = "730"
  WA_GRAPH_VERSION = "v21.0"
  # W1-11: Deepgram for the web recorder (DEEPGRAM_API_KEY as a Fly secret; without it every
  # transcribe_upload fails in production, never the fake). WhatsApp voice notes keep OpenAI
  # whisper-1 (OPENAI_API_KEY) until step 22.
  TRANSCRIBE_PROVIDER = "deepgram"
  TRANSCRIBE_MODEL = "nova-3"
  CLAUDE_MODEL = "claude-sonnet-5-5"
  CLAUDE_MODEL_FAST = "claude-haiku-5-5"
  EMAIL_PROVIDER = "resend"
  EMAIL_FROM = "SiteLog <reports@sitelog.app>"
  APP_URL = "https://app.sitelog.app"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
